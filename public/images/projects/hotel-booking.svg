<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#171A21"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="100%" stop-color="#13161C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#272A33" stroke-width="1" opacity="0.3"/>
  <path d="M160 0 V450 M320 0 V450 M480 0 V450 M640 0 V450" stroke="#272A33" stroke-width="1" opacity="0.3"/>

  <!-- Browser Window Frame -->
  <rect x="60" y="40" width="680" height="370" rx="16" fill="#171A21" stroke="#272A33" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="60" y="40" width="680" height="44" rx="16" fill="#13161C"/>
  <path d="M60 84 H740" stroke="#272A33" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="85" cy="62" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="105" cy="62" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="125" cy="62" r="6" fill="#10B981" opacity="0.8"/>
  
  <!-- Address Bar -->
  <rect x="160" y="50" width="480" height="24" rx="6" fill="#1E222D" stroke="#272A33" stroke-width="1"/>
  <text x="180" y="66" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">https://hotel-booking.local/dashboard</text>

  <!-- Dashboard Content -->
  <!-- Left Sidebar -->
  <rect x="80" y="104" width="140" height="286" rx="8" fill="#13161C" stroke="#272A33" stroke-width="1"/>
  <rect x="96" y="124" width="108" height="12" rx="4" fill="#8B5CF6" opacity="0.8"/>
  <rect x="96" y="150" width="80" height="8" rx="3" fill="#272A33"/>
  <rect x="96" y="170" width="90" height="8" rx="3" fill="#272A33"/>
  <rect x="96" y="190" width="70" height="8" rx="3" fill="#272A33"/>
  <rect x="96" y="210" width="85" height="8" rx="3" fill="#272A33"/>

  <!-- Main Panel -->
  <rect x="236" y="104" width="484" height="60" rx="8" fill="url(#cardGrad)" stroke="#272A33" stroke-width="1"/>
  <text x="256" y="132" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">Smart Hotel Booking System</text>
  <text x="256" y="150" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Available Rooms: 24 • Today Bookings: 12 • Revenue: ฿38,500</text>

  <!-- Room Cards Grid -->
  <!-- Card 1 -->
  <rect x="236" y="180" width="152" height="130" rx="8" fill="#13161C" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="246" y="192" width="132" height="50" rx="6" fill="#8B5CF6" opacity="0.15"/>
  <text x="312" y="222" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">DELUXE</text>
  <text x="246" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Room 301 - King Bed</text>
  <rect x="246" y="272" width="60" height="16" rx="4" fill="#10B981" opacity="0.2"/>
  <text x="276" y="284" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AVAILABLE</text>

  <!-- Card 2 -->
  <rect x="402" y="180" width="152" height="130" rx="8" fill="#13161C" stroke="#272A33" stroke-width="1"/>
  <rect x="412" y="192" width="132" height="50" rx="6" fill="#6366F1" opacity="0.15"/>
  <text x="478" y="222" fill="#6366F1" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">SUITE</text>
  <text x="412" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Room 402 - Sea View</text>
  <rect x="412" y="272" width="60" height="16" rx="4" fill="#8B5CF6" opacity="0.2"/>
  <text x="442" y="284" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">RESERVED</text>

  <!-- Card 3 -->
  <rect x="568" y="180" width="152" height="130" rx="8" fill="#13161C" stroke="#272A33" stroke-width="1"/>
  <rect x="578" y="192" width="132" height="50" rx="6" fill="#EC4899" opacity="0.15"/>
  <text x="644" y="222" fill="#EC4899" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">STANDARD</text>
  <text x="578" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Room 105 - Twin Bed</text>
  <rect x="578" y="272" width="60" height="16" rx="4" fill="#10B981" opacity="0.2"/>
  <text x="608" y="284" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AVAILABLE</text>

  <!-- Bottom Action Bar -->
  <rect x="236" y="324" width="484" height="66" rx="8" fill="#13161C" stroke="#272A33" stroke-width="1"/>
  <text x="256" y="352" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Direct Booking & Instant Payment System</text>
  <text x="256" y="370" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Automated receipt generation with PHP & MySQL backend</text>
  <rect x="620" y="340" width="85" height="34" rx="6" fill="url(#accentGrad)"/>
  <text x="662" y="362" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">BOOK NOW</text>
</svg>
