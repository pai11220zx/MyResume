<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#171A21"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="180" fill="#8B5CF6" opacity="0.08" filter="blur(40px)"/>
  <circle cx="650" cy="300" r="160" fill="#3B82F6" opacity="0.08" filter="blur(40px)"/>

  <!-- Code Editor Frame -->
  <rect x="60" y="40" width="680" height="370" rx="16" fill="#171A21" stroke="#272A33" stroke-width="2"/>
  
  <!-- Editor Header -->
  <rect x="60" y="40" width="680" height="44" rx="16" fill="#13161C"/>
  <path d="M60 84 H740" stroke="#272A33" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="85" cy="62" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="105" cy="62" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="125" cy="62" r="6" fill="#10B981" opacity="0.8"/>
  
  <!-- Active Tab -->
  <rect x="160" y="46" width="140" height="38" rx="6" fill="#171A21" stroke="#272A33" stroke-width="1"/>
  <text x="185" y="70" fill="#8B5CF6" font-family="monospace" font-weight="bold" font-size="12">Portfolio.jsx</text>
  <rect x="308" y="52" width="110" height="26" rx="4" fill="#13161C"/>
  <text x="325" y="69" fill="#A1A1AA" font-family="monospace" font-size="11">App.css</text>

  <!-- Left: Code Section -->
  <rect x="80" y="100" width="310" height="290" rx="8" fill="#13161C" stroke="#272A33" stroke-width="1"/>
  <text x="100" y="130" fill="#F43F5E" font-family="monospace" font-size="12">import</text>
  <text x="155" y="130" fill="#FFFFFF" font-family="monospace" font-size="12">{ motion }</text>
  <text x="235" y="130" fill="#F43F5E" font-family="monospace" font-size="12">from</text>
  <text x="275" y="130" fill="#10B981" font-family="monospace" font-size="12">'framer-motion'</text>

  <text x="100" y="160" fill="#8B5CF6" font-family="monospace" font-size="12">export default function</text>
  <text x="280" y="160" fill="#38BDF8" font-family="monospace" font-size="12">Hero() {</text>

  <text x="120" y="190" fill="#F43F5E" font-family="monospace" font-size="12">return (</text>
  <text x="140" y="215" fill="#E2E8F0" font-family="monospace" font-size="11">&lt;motion.div</text>
  <text x="160" y="235" fill="#F59E0B" font-family="monospace" font-size="11">initial=&#123;&#123; opacity: 0 &#125;&#125;</text>
  <text x="160" y="255" fill="#F59E0B" font-family="monospace" font-size="11">animate=&#123;&#123; opacity: 1 &#125;&#125;</text>
  <text x="160" y="275" fill="#F59E0B" font-family="monospace" font-size="11">className="portfolio-hero"</text>
  <text x="140" y="295" fill="#E2E8F0" font-family="monospace" font-size="11">&gt;</text>
  <text x="160" y="320" fill="#10B981" font-family="monospace" font-size="11">&lt;h1&gt;PAI.dev&lt;/h1&gt;</text>
  <text x="140" y="345" fill="#E2E8F0" font-family="monospace" font-size="11">&lt;/motion.div&gt;</text>
  <text x="120" y="370" fill="#F43F5E" font-family="monospace" font-size="12">)</text>

  <!-- Right: Live Interactive UI Preview -->
  <rect x="410" y="100" width="310" height="290" rx="8" fill="#0F1117" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="565" cy="155" r="32" fill="#8B5CF6" opacity="0.2"/>
  <text x="565" y="163" fill="#8B5CF6" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">P</text>
  
  <text x="565" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">PAI Portfolio</text>
  <text x="565" y="230" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Software Developer • Dark Theme</text>

  <!-- Tech tags -->
  <rect x="440" y="255" width="65" height="22" rx="6" fill="#171A21" stroke="#272A33"/>
  <text x="472" y="270" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">React</text>
  
  <rect x="515" y="255" width="75" height="22" rx="6" fill="#171A21" stroke="#272A33"/>
  <text x="552" y="270" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Tailwind</text>

  <rect x="600" y="255" width="90" height="22" rx="6" fill="#171A21" stroke="#272A33"/>
  <text x="645" y="270" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Framer Motion</text>

  <!-- Interactive Button -->
  <rect x="465" y="300" width="200" height="38" rx="8" fill="url(#purpleGlow)"/>
  <text x="565" y="324" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">EXPLORE PROJECTS</text>
</svg>
